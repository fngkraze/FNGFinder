services:
  - type: web
    name: 2oo1finder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MAX_DAILY_SCANS
        value: 20
